# App name
spring.application.name=notification-service

# Server port
server.port=8084

# ================= DATABASE =================
spring.datasource.url=jdbc:mysql://localhost:3306/flowboard_notification?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# ================= JPA =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ================= EUREKA =================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Force localhost in Eureka
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
eureka.instance.instance-id=${eureka.instance.hostname}:${spring.application.name}:${server.port}

# ================= MAIL (SMTP) =================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=flowboard.work@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# ================= RABBITMQ =================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# ================= CROSS-SERVICE URLs =================
user.service.url=http://user-service:8081
