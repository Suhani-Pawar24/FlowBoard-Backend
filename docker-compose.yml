    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    image: flowboard/payment-service:latest
    container_name: flowboard-payment
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/flowboard_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
      EUREKA_INSTANCE_HOSTNAME: payment-service
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      WORKSPACE_SERVICE_URL: ${WORKSPACE_SERVICE_URL}
    networks:
      - flowboard-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8089/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s

  # ── API Gateway ───────────────────────────────────────────

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: flowboard/api-gateway:latest
    container_name: flowboard-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      eureka:
        condition: service_healthy
      user-service:
        condition: service_healthy
      workspace-service:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      FRONTEND_URL: http://localhost:5173
      USER_SERVICE_URL: ${USER_SERVICE_URL}
    networks:
      - flowboard-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s

