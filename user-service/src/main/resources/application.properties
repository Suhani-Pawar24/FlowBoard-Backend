# App name
spring.application.name=auth-service

# Server port
server.port=8081

# ================= DATABASE =================
spring.datasource.url=jdbc:mysql://localhost:3306/flowboard_user?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# ================= JPA =================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ================= EUREKA =================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Force localhost in Eureka (IMPORTANT FIX)
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
eureka.instance.instance-id=${eureka.instance.hostname}:${spring.application.name}:${server.port}

# ================= JWT =================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ================= CROSS-SERVICE URLS (for admin analytics) =================
workspace.service.url=http://workspace-service:8082
board.service.url=http://board-service:8083
card.service.url=http://card-service:8086
notification.service.url=http://notification-service:8084/notifications/bulk
